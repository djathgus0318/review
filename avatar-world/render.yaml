services:
  - type: web
    name: sai-realtime
    runtime: node
    plan: free
    rootDir: avatar-world
    buildCommand: npm ci --omit=dev
    startCommand: npm run server
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: CLIENT_ORIGIN
        sync: false
